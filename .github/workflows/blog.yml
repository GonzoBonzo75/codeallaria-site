name: Blog - genera le pagine degli articoli

# Si avvia da solo quando dall'area riservata (/admin) pubblichi, modifichi o cancelli un articolo.
on:
  push:
    branches: [main]
    paths:
      - "content/blog/**"
      - "images/blog/**"
      - "tools/build_blog.py"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: blog-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown pyyaml pillow
      - run: python3 tools/build_blog.py
      - name: Salva le pagine generate
        run: |
          git config user.name "Blog automatico"
          git config user.email "actions@users.noreply.github.com"
          git add -A blog blog.html sitemap.xml images/blog-web
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare"
          else
            git commit -m "Blog: pagine aggiornate automaticamente"
            git push
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pubblicazione avviata dal sistema di GitHub"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
